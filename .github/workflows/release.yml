name: Release

on:
  push:
    tags:
      - "v*"

# Allow the workflow to create releases and upload assets.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          #          - platform: macos-latest
          #            args: "--target universal-apple-darwin"
          #          - platform: ubuntu-22.04
          #            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          # Strip a leading "v" from the tag (v1.2.3 -> 1.2.3).
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION from tag $GITHUB_REF_NAME"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binaries need both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            file

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version from tag
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Single source of truth: the git tag. Patch the version into the
          # Tauri config and Cargo manifest so nothing has to be hardcoded.
          node -e '
            const fs = require("fs");
            const version = process.env.APP_VERSION;

            const confPath = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");

            const cargoPath = "src-tauri/Cargo.toml";
            let cargo = fs.readFileSync(cargoPath, "utf8");
            cargo = cargo.replace(/^version = ".*"/m, `version = "${version}"`);
            fs.writeFileSync(cargoPath, cargo);

            console.log(`Set version to ${version}`);
          '
          # Keep Cargo.lock in sync with the new package version.
          cargo update --manifest-path src-tauri/Cargo.toml --package bimbleboard --precise "$APP_VERSION" || true

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Bimbleboard ${{ steps.version.outputs.version }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
